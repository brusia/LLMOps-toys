[project]
name = "llmops-toy-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.4.2",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pymorphy2>=0.9.1",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "strenum>=0.4.15",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]

[dependency-groups]
metrics = [
    "nltk>=3.9.2",
    "rouge-score>=0.1.2",
]
mlflow = [
    "mlflow>=3.8.1",
]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
