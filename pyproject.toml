[project]
name = "llmops-toy-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.4.2",
    "hydra-core>=1.3.2",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "openai>=1.0.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pydantic>=2.12.5",
    "pymorphy2>=0.9.1",
    "requests>=2.32.5",
    "strenum>=0.4.15",
    "torch>=2.6.0",
    "transformers>=4.57.3",
]

[dependency-groups]
agents = [
    "chromadb>=1.5.0",
    "langchain>=1.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.9",
    "langfuse>=3.12.1",
    "llama-index>=0.14.14",
    "pypdf>=6.7.0",
    "sentence-transformers>=5.2.2",
]
metrics = [
    "nltk>=3.9.2",
    "rouge-score>=0.1.2",
]
mlflow = [
    "mlflow>=3.8.1",
]
rag = [
    "chromadb>=1.5.2",
    "sentence-transformers>=5.2.3",
]
visual = [
    "bertviz>=1.4.1",
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
